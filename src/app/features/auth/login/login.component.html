<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
</style>

<div class="min-h-screen flex items-center justify-center bg-[#f8f9fa] font-['Inter'] p-4">
  <div class="bg-white p-8 md:p-10 rounded-sm shadow-sm border border-slate-200 w-full max-w-md">

    <div class="text-center mb-8">
       <p class="text-xs font-semibold uppercase tracking-widest text-emerald-800">FacultyPoint</p>
       <h2 class="mt-2 text-2xl font-semibold text-slate-900 tracking-tight">Portal Login</h2>
    <p class="text-sm text-slate-500 mt-2">Sign in to manage your directory status.</p>
 </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off" class="space-y-5">
      <div>
      <label class="block text-sm font-medium text-slate-800 mb-2">Username</label>
      <input type="text" formControlName="username" autocomplete="off"
      autocapitalize="none" autocorrect="off" spellcheck="false"
      class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 text-base sm:text-sm focus:border-slate-800 focus:ring-0 outline-none transition-colors rounded-sm">
</div>

      <div>
        <label class="block text-sm font-medium text-slate-800 mb-2">Password</label>
        <input type="password" formControlName="password" autocomplete="new-password"
          class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:border-slate-800 focus:ring-0 outline-none transition-colors rounded-sm">
      </div>

      @if (errorMessage()) {
        <div class="bg-red-50 border-l-4 border-red-800 p-3">
          <p class="text-sm text-red-900 font-medium">{{ errorMessage() }}</p>
        </div>
      }

      <button type="submit" [disabled]="loginForm.invalid || isLoading()"
        class="w-full py-2.5 bg-slate-800 text-white text-sm font-medium hover:bg-slate-900 transition-colors duration-150 disabled:opacity-50 rounded-sm mt-2">
        {{ isLoading() ? 'Signing in...' : 'Sign In' }}
      </button>

      <div class="mt-6 text-center">
         <a routerLink="/" class="text-sm font-medium text-slate-500 underline-offset-4 transition-colors hover:text-slate-900 hover:underline">
         &larr; Back to directory
      </a>
     </div>
    </form>

  </div>
</div>
