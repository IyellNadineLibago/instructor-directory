<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
</style>

<div class="min-h-screen flex items-center justify-center bg-[#f8f9fa] p-4" style="font-family: 'Inter', sans-serif;">
  <div class="bg-white p-8 md:p-10 rounded-sm shadow-sm border border-slate-200 w-full max-w-md">

    <div class="text-center mb-8">
      <p class="text-xs font-semibold uppercase tracking-widest text-emerald-800">FacultyPoint</p>
      <h2 class="mt-2 text-2xl font-semibold text-slate-900 tracking-tight">Choose a new password</h2>
      <p class="text-sm text-slate-500 mt-2">
        You're using a temporary password. Set your own to continue.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-800 mb-2">New password</label>
        <input type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password"
          class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 text-base sm:text-sm focus:border-slate-800 focus:ring-0 outline-none transition-colors rounded-sm">
        <p class="mt-1.5 text-xs text-slate-500">At least 8 characters.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-800 mb-2">Confirm new password</label>
        <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password"
          class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 text-base sm:text-sm focus:border-slate-800 focus:ring-0 outline-none transition-colors rounded-sm">
        @if (confirmPassword && newPassword !== confirmPassword) {
          <p class="mt-1.5 text-xs text-red-800">Passwords don't match.</p>
        }
      </div>

      @if (errorMessage()) {
        <div class="bg-red-50 border-l-4 border-red-800 p-3">
          <p class="text-sm text-red-900 font-medium">{{ errorMessage() }}</p>
        </div>
      }

      <button type="submit" [disabled]="!canSubmit || isSaving()"
        class="w-full py-2.5 bg-slate-800 text-white text-sm font-medium hover:bg-slate-900 transition-colors duration-150 disabled:opacity-50 rounded-sm mt-2">
        {{ isSaving() ? 'Saving...' : 'Save and continue' }}
      </button>
    </form>

    <div class="mt-6 text-center">
      <button type="button" (click)="signOut()"
        class="text-sm font-medium text-slate-500 underline-offset-4 transition-colors hover:text-slate-900 hover:underline">
        Sign out
      </button>
    </div>

  </div>
</div>
